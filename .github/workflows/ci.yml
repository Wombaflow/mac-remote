name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile mac_remote.py
      - name: Version flag
        run: python mac_remote.py --version
      - name: Smoke test (server serves the page)
        run: |
          MOCK=1 PORT=18080 TLS_PORT=18443 python mac_remote.py > server.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:18080/ | grep -q "<title>Mac</title>"
